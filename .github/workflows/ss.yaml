name: Paso2 - Secret Scan

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fluidattacks/ss-action@0.2.0
        with:
          scan_config_path: .github/ss-config.yaml